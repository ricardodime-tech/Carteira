<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carteira de Ações</title>
    <link rel="stylesheet" href="/style.css">
    <!-- Importa a biblioteca Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- Cabeçalho com Logo e Título -->
        <div class="cabecalho">
            <img src="/logo.png" alt="Logo da Carteira" class="logo">
            <h1>Minha Carteira de Ações</h1>
        </div>
        
        <!-- Botões de Ação do Topo -->
        <div class="topo-acoes">
            <button class="btn-grafico" onclick="abrirModalGrafico()">Ver Gráfico da Carteira</button>
            <button class="btn-yahoo-geral" onclick="atualizarTodosYahoo(this)">Atualizar Todos (Yahoo)</button>
        </div>

        <!-- Formulário para Incluir Novo Ativo -->
        <div class="form-container">
            <h3>Adicionar Novo Ativo</h3>
            <form id="formNovoAtivo" onsubmit="adicionarAtivo(event)">
                <input type="text" id="novoTicker" placeholder="Ticker (Ex: VALE3)" required />
                <input type="number" step="0.01" id="novoPreco" placeholder="Preço" required />
                <input type="number" id="novaQuantidade" placeholder="Quantidade" required />
                <button type="submit" class="btn-adicionar">Adicionar Ativo</button>
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Ticker</th>
                    <th>Preço</th>
                    <th>Variação</th>
                    <th>Quantidade</th>
                    <th>Valor Total (VT)</th>
                    <th>Última Atualização (UA)</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {{tabelaAcoes}}
            </tbody>
        </table>
    </div>

    <!-- Janela Modal do Gráfico -->
    <div id="modalGrafico" class="modal">
        <div class="modal-conteudo">
            <span class="fechar" onclick="fecharModalGrafico()">&times;</span>
            <h2>Distribuição da Carteira</h2>
            <!-- Destaque para o Valor Total da Carteira -->
            <div id="valorTotalCarteira" class="modal-total-carteira">Valor Total: R$ 0,00</div>
            
            <div class="grafico-container">
                <canvas id="pizzaChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let meuGrafico = null;

        function habilitarEdicao(botao, ticker) {
            const linha = botao.closest('tr');
            const celulas = linha.querySelectorAll('.editavel');
            
            celulas.forEach(celula => {
                const valorAtual = celula.innerText.replace('R$', '').trim();
                celula.innerHTML = `<input type="text" value="${valorAtual}" style="width: 80px;" />`;
            });

            botao.innerText = 'Gravar';
            botao.className = 'btn-gravar';
            botao.setAttribute('onclick', `salvarEdicao(this, '${ticker}')`);
        }

        async function salvarEdicao(botao, ticker) {
            const linha = botao.closest('tr');
            const inputs = linha.querySelectorAll('input');

            const novoPreco = parseFloat(inputs[0].value) || 0;
            const novaVariacao = parseFloat(inputs[1].value) || 0;
            const novaQuantidade = parseInt(inputs[2].value) || 0;
            const novoVT = (novoPreco * novaQuantidade).toFixed(2);
            const novaUA = new Date().toLocaleTimeString('pt-BR');

            const dadosAtualizados = {
                Preco: novoPreco,
                Variacao: novaVariacao,
                Quantidade: novaQuantidade,
                VT: novoVT,
                UA: novaUA
            };

            try {
                const resposta = await fetch(`/atualizar/${ticker}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosAtualizados)
                });

                if (resposta.ok) {
                    window.location.reload();
                } else {
                    alert('Erro ao salvar os dados.');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro de conexão ao salvar.');
            }
        }

        async function adicionarAtivo(event) {
            event.preventDefault();

            const ticker = document.getElementById('novoTicker').value.toUpperCase().trim();
            const preco = parseFloat(document.getElementById('novoPreco').value) || 0;
            const quantidade = parseInt(document.getElementById('novaQuantidade').value) || 0;
            
            const variacao = 0;
            const vt = (preco * quantidade).toFixed(2);
            const ua = new Date().toLocaleTimeString('pt-BR');

            const novoAtivo = {
                Ticker: ticker,
                Preco: preco,
                Variacao: variacao,
                Quantidade: quantidade,
                VT: vt,
                UA: ua
            };

            try {
                const resposta = await fetch('/adicionar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(novoAtivo)
                });

                const resultado = await resposta.json();

                if (resposta.ok) {
                    window.location.reload();
                } else {
                    alert(resultado.mensagem || 'Erro ao adicionar ativo.');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro de conexão ao adicionar ativo.');
            }
        }

        async function atualizarTodosYahoo(botao) {
            botao.innerText = 'Atualizando todos...';
            botao.disabled = true;

            try {
                const resposta = await fetch('/yahoo/atualizar-todos', {
                    method: 'POST'
                });

                if (resposta.ok) {
                    window.location.reload();
                } else {
                    alert('Erro ao atualizar as cotações.');
                    botao.innerText = 'Atualizar Todos (Yahoo)';
                    botao.disabled = false;
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro de conexão ao atualizar o Yahoo Finance.');
                botao.innerText = 'Atualizar Todos (Yahoo)';
                botao.disabled = false;
            }
        }

        // Funções para gerenciar a Modal e o Gráfico com Legendas customizadas
        async function abrirModalGrafico() {
            const modal = document.getElementById('modalGrafico');
            modal.style.display = 'flex';

            try {
                const resposta = await fetch('/dados-grafico');
                const dados = await resposta.json();

                const valores = dados.map(item => parseFloat(item.VT) || 0);
                const valorTotalGeral = valores.reduce((a, b) => a + b, 0);

                // Exibe o Valor Total da Carteira na modal
                document.getElementById('valorTotalCarteira').innerText = 
                    `Patrimônio Total: R$ ${valorTotalGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;

                // Cria os labels combinando Ticker, Valor Total em R$ e a porcentagem exata
                const labels = dados.map((item, index) => {
                    const val = valores[index];
                    const percentual = valorTotalGeral > 0 ? ((val / valorTotalGeral) * 100).toFixed(1) : 0;
                    return `${item.Ticker}: R$ ${val.toLocaleString('pt-BR', {minimumFractionDigits: 2})} (${percentual}%)`;
                });

                const ctx = document.getElementById('pizzaChart').getContext('2d');

                if (meuGrafico) {
                    meuGrafico.destroy();
                }

                meuGrafico = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: valores,
                            backgroundColor: [
                                '#1abc9c', '#3498db', '#9b59b6', '#e74c3c', 
                                '#f1c40f', '#e67e22', '#2ecc71', '#34495e',
                                '#16a085', '#2980b9', '#8e44ad', '#d35400'
                            ]
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    boxWidth: 15,
                                    font: {
                                        size: 12
                                    }
                                }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const valor = context.raw || 0;
                                        const percentual = valorTotalGeral > 0 ? ((valor / valorTotalGeral) * 100).toFixed(1) : 0;
                                        return ` Valor: R$ ${valor.toLocaleString('pt-BR', {minimumFractionDigits: 2})} (${percentual}%)`;
                                    }
                                }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Erro ao carregar dados para o gráfico:', error);
                alert('Erro ao carregar o gráfico.');
            }
        }

        function fecharModalGrafico() {
            const modal = document.getElementById('modalGrafico');
            modal.style.display = 'none';
        }
    </script>
</body>
</html>
